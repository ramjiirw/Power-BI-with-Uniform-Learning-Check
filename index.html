<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power BI with Uniform – Learning Check</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    overflow: hidden;
}

header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    padding: 28px;
    text-align: center;
}

header h1 { font-size: 1.8em; margin-bottom: 8px; }
header p { opacity: 0.9; }

.progress {
    height: 8px;
    background: #ddd;
    margin: 20px 30px;
    border-radius: 4px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4caf50, #8bc34a);
    transition: width 0.3s;
}

.content { padding: 30px; }

.question-number {
    color: #2a5298;
    font-weight: 600;
    margin-bottom: 6px;
}

.question {
    font-size: 1.2em;
    font-weight: 600;
    color: #1e3c72;
    margin-bottom: 20px;
}

.option {
    background: #f5f5f5;
    border: 2px solid #e0e0e0;
    padding: 14px 18px;
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
}

.option:hover {
    background: #e8f0ff;
    border-color: #2a5298;
}

.option.correct { background: #4caf50; color: #fff; }
.option.incorrect { background: #f44336; color: #fff; }
.option.disabled { pointer-events: none; opacity: 0.85; }

.feedback {
    margin-top: 15px;
    padding: 14px;
    border-radius: 8px;
    display: none;
}

.feedback.correct { background: #e8f5e9; color: #2e7d32; }
.feedback.incorrect { background: #ffebee; color: #c62828; }

.buttons {
    margin-top: 25px;
    display: flex;
    justify-content: space-between;
}

button {
    padding: 12px 26px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}

.btn-primary { background: #2a5298; color: #fff; }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.btn-secondary { background: #777; color: #fff; }

.results {
    display: none;
    padding: 40px;
    text-align: center;
}

.score {
    font-size: 3em;
    font-weight: bold;
    color: #2a5298;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Power BI with Uniform – Learning Check</h1>
  <p>Idox Training</p>
</header>

<div class="progress">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div class="content" id="intro">
  <h2 style="color:#1e3c72;margin-bottom:15px;">Power BI with Uniform – Learning Check</h2>
  <p style="margin-bottom:12px;">You’ve now completed the Power BI with Uniform training.</p>
  <p style="margin-bottom:12px;">This learning check reinforces how Power BI works with Uniform data.</p>
  <p style="margin-bottom:20px;">Choose the answer that best reflects real reporting behaviour.</p>
  <button class="btn-primary" onclick="startQuiz()">Start learning check</button>
</div>

<div class="content" id="quiz" style="display:none;"></div>
<div class="results" id="results"></div>

</div>

<script>

const quizData = [
{
question:"What is the main purpose of using Power BI alongside Uniform?",
options:[
"To replace Uniform screens with reports",
"To analyse and present Uniform data in clear, interactive reports",
"To automate statutory decisions",
"To enter and update case data"
],
correct:1,
explanation:"Power BI is used to analyse, summarise, and present data that already exists in Uniform. It does not replace Uniform or allow data entry."
},
{
question:"When connecting Power BI to Uniform using ODBC, which statement is correct?",
options:[
"Power BI can update Uniform data",
"Data is changed during refresh",
"Uniform calculations are overwritten",
"The connection is read-only"
],
correct:3,
explanation:"ODBC connections are read-only. Power BI cannot insert, update, or delete Uniform data."
},
{
question:"Where should you rename Uniform field names so the change applies everywhere?",
options:[
"In Power Query",
"In Table view",
"In visual formatting",
"In the report canvas"
],
correct:0,
explanation:"Renaming in Power Query applies the change across the entire model."
},
{
question:"You want only cases from the last 5 years. Where should this filter be applied?",
options:[
"In every visual",
"In a slicer only",
"In Power Query",
"In visual-level filters"
],
correct:2,
explanation:"Filtering in Power Query defines the dataset scope before reporting begins."
},
{
question:"What does a relationship between Uniform tables define?",
options:[
"Which table loads first",
"Which rows belong together",
"Which visual to use",
"Which table is editable"
],
correct:1,
explanation:"Relationships tell Power BI how rows in different tables are connected."
},
{
question:"Parent table filtered, child table not. What’s the issue?",
options:[
"Duplicate measures",
"Broken visuals",
"Slower refresh",
"Orphaned records"
],
correct:3,
explanation:"Child rows can remain without a matching parent, causing incorrect counts."
},
{
question:"Why must related tables stay in step?",
options:[
"To ensure accurate counts",
"To reduce file size",
"To improve layout",
"To allow publishing"
],
correct:0,
explanation:"Out-of-step tables produce misleading totals."
},
{
question:"Calculated column vs measure — what’s the key difference?",
options:[
"Measures only work in tables",
"Columns are faster",
"Columns calculate once; measures recalc with filters",
"Measures store data"
],
correct:2,
explanation:"Measures recalculate dynamically; columns do not."
},
{
question:"Some cases have no decision date. What should DAX do first?",
options:[
"Replace with today",
"Check for blanks",
"Return zero",
"Convert to text"
],
correct:1,
explanation:"Blank checks prevent misleading calculations."
},
{
question:"What does this measure return?\n\nCOUNTROWS where DATEDECISS is not blank",
options:[
"All rows",
"Today’s cases",
"Visible rows only",
"Decided cases"
],
correct:3,
explanation:"It counts cases with a decision date."
},
{
question:"What does a slicer change?",
options:[
"The rows included",
"The logic",
"The data source",
"The refresh"
],
correct:0,
explanation:"Slicers change filter context only."
},
{
question:"Formatting affects what?",
options:[
"The value",
"The calculation",
"The display",
"The refresh"
],
correct:2,
explanation:"Formatting changes appearance, not logic."
},
{
question:"Report looks right but feels wrong. Check what first?",
options:[
"Colours",
"Relationships and measures",
"Navigation",
"Titles"
],
correct:1,
explanation:"Logic always comes before appearance."
},
{
question:"Publishing vs sharing vs refresh?",
options:[
"Publishing shares",
"Sharing refreshes",
"Refresh fixes errors",
"Publish online; share access; refresh data"
],
correct:3,
explanation:"They are separate actions."
}
];

let current = 0;
let score = 0;

function startQuiz(){
  document.getElementById("intro").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  render();
}

function render(){
  const q = quizData[current];
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = `
    <div class="question-number">Question ${current+1} of ${quizData.length}</div>
    <div class="question">${q.question.replace(/\n/g,"<br>")}</div>
    ${q.options.map((o,i)=>`<div class="option" onclick="selectOption(${i})">${o}</div>`).join("")}
    <div class="feedback" id="feedback"></div>
    <div class="buttons">
      <button class="btn-secondary" onclick="prev()" ${current===0?"disabled":""}>Previous</button>
      <button class="btn-primary" id="nextBtn" disabled onclick="next()">Next</button>
    </div>`;
  document.getElementById("progressFill").style.width = ((current+1)/quizData.length*100)+"%";
}

function selectOption(i){
  const opts = document.querySelectorAll(".option");
  const fb = document.getElementById("feedback");
  opts.forEach(o=>o.classList.add("disabled"));
  if(i===quizData[current].correct){
    opts[i].classList.add("correct");
    fb.className="feedback correct";
    fb.textContent="Correct – "+quizData[current].explanation;
    score++;
  } else {
    opts[i].classList.add("incorrect");
    opts[quizData[current].correct].classList.add("correct");
    fb.className="feedback incorrect";
    fb.textContent="Incorrect – "+quizData[current].explanation;
  }
  fb.style.display="block";
  document.getElementById("nextBtn").disabled=false;
}

function next(){
  current < quizData.length-1 ? (current++, render()) : showResults();
}

function prev(){
  current--;
  render();
}

function showResults(){
  document.getElementById("quiz").style.display="none";
  const r=document.getElementById("results");
  r.style.display="block";
  r.innerHTML=`
    <h2>Learning Check Complete</h2>
    <div class="score">${score} / ${quizData.length}</div>
    <p>If anything was unclear, revisit the training materials.</p>`;
}

</script>
</body>
</html>
